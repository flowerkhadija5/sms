<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student & Teacher Management System - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        .login-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Login Card -->
        <div class="glass-effect rounded-2xl p-8 shadow-2xl">
            <!-- Logo/Header -->
            <div class="text-center mb-8">
                <div class="mx-auto w-16 h-16 bg-white bg-opacity-20 rounded-full flex items-center justify-center mb-4">
                    <i data-lucide="graduation-cap" class="w-8 h-8 text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-white mb-2">Student & Teacher</h1>
                <p class="text-white text-opacity-80">Management System</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-white mb-2">
                        <i data-lucide="user" class="inline w-4 h-4 mr-2"></i>Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        class="w-full px-4 py-3 bg-white bg-opacity-20 border border-white border-opacity-30 rounded-lg text-white placeholder-white placeholder-opacity-70 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50"
                        placeholder="Enter your username"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-white mb-2">
                        <i data-lucide="lock" class="inline w-4 h-4 mr-2"></i>Password
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required
                            class="w-full px-4 py-3 bg-white bg-opacity-20 border border-white border-opacity-30 rounded-lg text-white placeholder-white placeholder-opacity-70 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50 pr-12"
                            placeholder="Enter your password"
                        >
                        <button 
                            type="button" 
                            id="togglePassword"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-white text-opacity-70 hover:text-opacity-100"
                        >
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden bg-red-500 bg-opacity-20 border border-red-500 border-opacity-50 text-red-100 px-4 py-3 rounded-lg">
                    <i data-lucide="alert-circle" class="inline w-4 h-4 mr-2"></i>
                    <span id="errorText"></span>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="loginBtn"
                    class="w-full bg-white bg-opacity-20 hover:bg-opacity-30 text-white font-semibold py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center"
                >
                    <span id="loginBtnText">
                        <i data-lucide="log-in" class="inline w-4 h-4 mr-2"></i>Sign In
                    </span>
                    <span id="loginSpinner" class="hidden">
                        <i data-lucide="loader-2" class="inline w-4 h-4 mr-2 animate-spin"></i>Signing In...
                    </span>
                </button>
            </form>

            <!-- Demo Credentials -->
            <div class="mt-8 p-4 bg-white bg-opacity-10 rounded-lg">
                <h3 class="text-white font-semibold mb-3 text-sm">Demo Credentials:</h3>
                <div class="space-y-2 text-xs text-white text-opacity-80">
                    <div><strong>Admin:</strong> admin / admin123</div>
                    <div><strong>Teacher:</strong> teacher1 / teacher123</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6">
            <p class="text-white text-opacity-60 text-sm">
                © 2024 Student & Teacher Management System
            </p>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Password toggle functionality
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordField = document.getElementById('password');
            const eyeIcon = this.querySelector('i');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordField.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const loginSpinner = document.getElementById('loginSpinner');

            // Hide previous errors
            errorDiv.classList.add('hidden');

            // Validate inputs
            if (!username || !password) {
                showError('Please fill in all fields');
                return;
            }

            // Show loading state
            loginBtn.disabled = true;
            loginBtnText.classList.add('hidden');
            loginSpinner.classList.remove('hidden');

            // Call Google Apps Script function
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        // Store user info in session storage
                        sessionStorage.setItem('userInfo', JSON.stringify(result.user));
                        console.log('User info stored:', result.user);
                        
                        // Small delay to ensure storage is complete
                        setTimeout(() => {
                            // Redirect to dashboard
                            const baseUrl = window.location.href.split('?')[0];
                            window.location.href = `${baseUrl}?page=dashboard`;
                        }, 100);
                    } else {
                        showError(result.message || 'Login failed');
                        resetLoginButton();
                    }
                })
                .withFailureHandler(function(error) {
                    console.error('Login error:', error);
                    showError('An error occurred during login. Please try again.');
                    resetLoginButton();
                })
                .authenticateUser(username, password);
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');
            
            // Re-initialize icons for the error message
            lucide.createIcons();
        }

        function resetLoginButton() {
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const loginSpinner = document.getElementById('loginSpinner');
            
            loginBtn.disabled = false;
            loginBtnText.classList.remove('hidden');
            loginSpinner.classList.add('hidden');
        }

        // Auto-fill demo credentials on click
        document.addEventListener('click', function(e) {
            if (e.target.textContent.includes('admin / admin123')) {
                document.getElementById('username').value = 'admin';
                document.getElementById('password').value = 'admin123';
            } else if (e.target.textContent.includes('teacher1 / teacher123')) {
                document.getElementById('username').value = 'teacher1';
                document.getElementById('password').value = 'teacher123';
            }
        });
    </script>
</body>
</html>
